<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito - CARLIM WORLD</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="icon" href="images/logo.png">
</head>
<body>

<!-- HEADER SIMPLE -->
<header class="header-login">
    <h1>TU CARRITO</h1>

<main class="carrito-container">


    <div class="producto-carrito">
        <img src="images/tecnologia/t5.png" alt="Producto">
        <div class="info">
            <h3>TV OLED XIAOMI 4K QHD</h3>
            <p>Precio: 339,95€</p>
        </div>
        <button class="eliminar">Eliminar</button>
    </div>

    <div class="producto-carrito">
        <img src="images/tecnologia/t9.png" alt="Producto">
        <div class="info">
            <h3>SMART SmartWatch Budsgx4</h3>
            <p>Precio: 44,99€</p>
        </div>
        <button class="eliminar">Eliminar</button>
    </div>

    <div class="total">
        <h3>Total: 467,98€</h3>
        <button class="comprar">Finalizar compra</button>
    </div>

</main>

<!-- FOOTER -->
<footer class="footer-login">
    <p>© 2026 - CARLIM WORLD</p>
     <a href="index.html" class="boton">↩ Menu Principal ↩</a>
</footer>

</body>
</html>
